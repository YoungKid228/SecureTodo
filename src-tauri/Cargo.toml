[package]
name = "secure-todo"
version = "0.1.0"
description = "Password-protected todo list with encrypted vault"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = { version = "0.10", features = ["alloc"] }
rand = "0.8"
zeroize = "1"
base64 = "0.22"
dirs = "5"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
